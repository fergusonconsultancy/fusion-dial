name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FusionDial.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FusionDial
          path: FusionDial.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fusion Dial build ${{ github.run_number }}
          files: FusionDial.apk

  # Installs the APK on a clean Android emulator and opens the wallpaper preview,
  # so a broken build is caught here and not on the phone.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FusionDial

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and open on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install FusionDial.apk
            adb shell pm list packages | grep fusiondial
            adb shell am start -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.fergusonconsultancy.fusiondial/.DialWallpaperService
            sleep 25
            adb exec-out screencap -p > preview-${{ matrix.api-level }}.png
            adb shell input keyevent KEYCODE_BACK
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell am start -f 0x10008000 -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.fergusonconsultancy.fusiondial/.CasebackWallpaperService
            sleep 25
            adb exec-out screencap -p > preview-caseback-${{ matrix.api-level }}.png
            adb shell input keyevent KEYCODE_BACK
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell am start -f 0x10008000 -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.fergusonconsultancy.fusiondial/.RotationWallpaperService
            sleep 25
            adb exec-out screencap -p > preview-rotation-${{ matrix.api-level }}.png
            adb root
            sleep 6
            adb wait-for-device
            adb shell settings put global auto_time 0
            for d in 12 13 14 15 16 17 18; do adb shell "date 10${d}10102026.00"; adb shell input keyevent KEYCODE_HOME; sleep 2; adb shell am start -f 0x10008000 -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.fergusonconsultancy.fusiondial/.RotationWallpaperService; sleep 14; adb exec-out screencap -p > preview-rotation-${{ matrix.api-level }}-day$d.png; done
            # Bezel test on the real home screen. The Tudor is the 12 Oct dial.
            adb shell "date 101210102026.00"; adb shell input keyevent KEYCODE_HOME; sleep 2
            adb shell am start -f 0x10008000 -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.fergusonconsultancy.fusiondial/.RotationWallpaperService; sleep 10
            tapText() {
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              B=$(adb shell cat /sdcard/ui.xml | tr '>' '\n' | grep -i "text=\"$1" | head -1 | sed -E 's/.*bounds="\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]".*/\1 \2 \3 \4/')
              echo "found '$1' at: $B"
              set -- $B
              [ -n "$4" ] && adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 ))
            }
            tapText "Set wallpaper"; sleep 3
            tapText "Home screen" || true; sleep 3
            adb shell input keyevent KEYCODE_HOME; sleep 4
            adb exec-out screencap -p > home-before-${{ matrix.api-level }}.png
            SIZE=$(adb shell wm size | grep -i physical | sed 's/.*: //' | tr -d '\r'); W=${SIZE%x*}; H=${SIZE#*x}
            R=$(( W * 421 * 76 / 100000 )); CY=$(( H * 60 / 100 )); YT=$(( CY - R * 125 / 100 ))
            Y=$(( YT + R * 12 / 100 ))
            echo "screen $W x $H, dial radius $R, centre y $CY, swipe at y $Y"
            adb shell input swipe $(( W / 2 + R * 55 / 100 )) $Y $(( W / 2 - R * 55 / 100 )) $Y 900
            sleep 2
            adb exec-out screencap -p > preview-bezel-${{ matrix.api-level }}.png
            adb logcat -d | grep -E "FusionDial|ViewRootImpl.*Wallpaper|WallpaperService" > bezel-log-${{ matrix.api-level }}.txt || true
            adb shell wm size >> bezel-log-${{ matrix.api-level }}.txt
            adb logcat -d > logcat-${{ matrix.api-level }}.txt
            grep -E "FusionDial|fusiondial|AndroidRuntime" logcat-${{ matrix.api-level }}.txt > app-log-${{ matrix.api-level }}.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ matrix.api-level }}
          path: |
            preview-*.png
            logcat-*.txt

      - name: Attach test results to the release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            preview-*.png
            app-log-*.txt
            bezel-log-*.txt
            home-before-*.png
